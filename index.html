<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Локальный ассистент</title>

<!-- iOS PWA support (works without a separate manifest.json) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Локальный ИИ">
<meta name="theme-color" content="#0B0F14">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230B0F14'/%3E%3Ccircle cx='50' cy='50' r='28' fill='none' stroke='%23FFB000' stroke-width='6'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%23FFB000'/%3E%3C/svg%3E">

<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --bg: #0B0F14;
    --panel: #111720;
    --panel-2: #161d29;
    --line: #232c3a;
    --text: #E8E6E1;
    --text-dim: #8892a0;
    --amber: #FFB000;
    --amber-dim: #8a6100;
    --slate: #5b6b82;
    --danger: #e2543e;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}

  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', -apple-system, sans-serif;
    overscroll-behavior:none;
  }

  body{
    display:flex;
    flex-direction:column;
    height:100dvh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  .mono{ font-family:'JetBrains Mono', monospace; }

  /* ---------- Header / instrument panel ---------- */
  header{
    padding:14px 16px 12px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--panel), var(--bg));
  }

  .title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }

  .title-row h1{
    font-size:16px;
    font-weight:800;
    margin:0;
    letter-spacing:0.2px;
  }

  .title-row h1 span{
    color:var(--amber);
  }

  .badge{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    font-weight:500;
    padding:3px 7px;
    border-radius:4px;
    border:1px solid var(--line);
    color:var(--text-dim);
    letter-spacing:0.5px;
  }

  .telemetry{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
  }

  .cell{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 9px;
  }

  .cell .k{
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.8px;
    margin-bottom:3px;
  }

  .cell .v{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:500;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .cell .v.amber{ color:var(--amber); }

  .progress-outer{
    margin-top:8px;
    height:4px;
    background:var(--panel-2);
    border-radius:2px;
    overflow:hidden;
    display:none;
  }
  .progress-outer.show{ display:block; }
  .progress-inner{
    height:100%;
    width:0%;
    background:var(--amber);
    transition:width 0.3s ease;
  }

  /* ---------- Chat area ---------- */
  #chat{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .msg{
    max-width:85%;
    padding:10px 13px;
    border-radius:12px;
    font-size:14.5px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
  }

  .msg.user{
    align-self:flex-end;
    background:var(--amber);
    color:#1a1200;
    border-bottom-right-radius:3px;
    font-weight:500;
  }

  .msg.assistant{
    align-self:flex-start;
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom-left-radius:3px;
  }

  .msg.system-note{
    align-self:center;
    background:transparent;
    color:var(--text-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    text-align:center;
    max-width:100%;
  }

  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--text-dim);
    padding:0 30px;
  }
  .empty-state .glyph{
    width:52px; height:52px;
    margin:0 auto 14px;
    border-radius:50%;
    border:2px solid var(--amber-dim);
    display:flex; align-items:center; justify-content:center;
  }
  .empty-state .glyph .dot{
    width:10px; height:10px;
    border-radius:50%;
    background:var(--amber);
  }
  .empty-state p{ font-size:13px; line-height:1.6; margin:4px 0; }
  .empty-state .lead{ color:var(--text); font-weight:600; font-size:14px; }

  /* ---------- Composer ---------- */
  #composer{
    border-top:1px solid var(--line);
    padding:10px 12px;
    background:var(--bg);
    display:flex;
    gap:8px;
    align-items:flex-end;
  }

  #input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-family:'Manrope', sans-serif;
    font-size:15px;
    padding:11px 13px;
    resize:none;
    max-height:120px;
    line-height:1.4;
  }
  #input:focus{ outline:none; border-color:var(--amber-dim); }
  #input:disabled{ opacity:0.5; }

  #send{
    width:42px; height:42px;
    border-radius:10px;
    background:var(--amber);
    border:none;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  #send:disabled{ background:var(--panel-2); }
  #send svg{ width:19px; height:19px; }

  #loadBtn{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid var(--amber-dim);
    background:var(--panel);
    color:var(--amber);
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    font-weight:500;
    letter-spacing:0.4px;
    text-transform:uppercase;
  }
  #loadBtn:active{ background:var(--panel-2); }
  #loadBtn:disabled{ opacity:0.55; }

  .spinner-dot{
    display:inline-block;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--amber);
    animation:pulse 1.1s ease-in-out infinite;
    margin-right:6px;
  }
  @keyframes pulse{
    0%,100%{ opacity:0.25; }
    50%{ opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    .spinner-dot{ animation:none; }
    .progress-inner{ transition:none; }
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>локальный<span>·</span>ассистент</h1>
    <span class="badge" id="statusBadge">НЕ ЗАГРУЖЕНО</span>
  </div>
  <div class="telemetry">
    <div class="cell">
      <div class="k">Модель</div>
      <div class="v">Llama 3.2 3B</div>
    </div>
    <div class="cell">
      <div class="k">Движок</div>
      <div class="v" id="engineCell">WebGPU —</div>
    </div>
    <div class="cell">
      <div class="k">Скорость</div>
      <div class="v amber" id="speedCell">— ток/с</div>
    </div>
  </div>
  <div class="progress-outer" id="progressOuter">
    <div class="progress-inner" id="progressInner"></div>
  </div>
</header>

<div id="chat">
  <div class="empty-state" id="emptyState">
    <div class="glyph"><div class="dot"></div></div>
    <p class="lead">Модель хранится и работает прямо в этом телефоне</p>
    <p>Запрос никуда не уходит — вычисления идут локально, в браузере, через WebGPU. Первая загрузка ≈2 ГБ, дальше модель берётся из кэша даже без сети.</p>
  </div>
</div>

<div id="composer">
  <button id="loadBtn" class="mono" style="display:none;"></button>
</div>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

const MODEL_ID = "Llama-3.2-3B-Instruct-q4f16_1-MLC";

const chatEl = document.getElementById('chat');
const emptyState = document.getElementById('emptyState');
const statusBadge = document.getElementById('statusBadge');
const engineCell = document.getElementById('engineCell');
const speedCell = document.getElementById('speedCell');
const progressOuter = document.getElementById('progressOuter');
const progressInner = document.getElementById('progressInner');
const composer = document.getElementById('composer');
const loadBtn = document.getElementById('loadBtn');

let engine = null;
let history = [];
let generating = false;

function addMsg(role, text){
  emptyState.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addSystemNote(text){
  const div = document.createElement('div');
  div.className = 'msg system-note';
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function checkSupport(){
  if (!('gpu' in navigator)) {
    engineCell.textContent = 'WebGPU нет';
    statusBadge.textContent = 'НЕ ПОДДЕРЖ.';
    statusBadge.style.color = 'var(--danger)';
    addSystemNote('Этот браузер не поддерживает WebGPU. На iPhone нужен Safari 17+ (iOS 17+). Попробуйте открыть эту страницу в Safari.');
    return false;
  }
  engineCell.textContent = 'WebGPU есть';
  return true;
}

function showLoadButton(){
  loadBtn.style.display = 'block';
  loadBtn.textContent = 'Загрузить модель (≈2 ГБ)';
  composer.querySelectorAll('#input, #send').forEach(e => e && e.remove());
  loadBtn.addEventListener('click', loadModel);
}

function buildComposer(){
  loadBtn.style.display = 'none';
  const textarea = document.createElement('textarea');
  textarea.id = 'input';
  textarea.rows = 1;
  textarea.placeholder = 'Спросите что-нибудь…';
  const btn = document.createElement('button');
  btn.id = 'send';
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#1a1200" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>';
  composer.appendChild(textarea);
  composer.appendChild(btn);

  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
  });
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      handleSend();
    }
  });
  btn.addEventListener('click', handleSend);
}

async function loadModel(){
  loadBtn.disabled = true;
  progressOuter.classList.add('show');
  statusBadge.innerHTML = '<span class="spinner-dot"></span>ЗАГРУЗКА';

  try {
    engine = new webllm.MLCEngine();
    engine.setInitProgressCallback((report) => {
      const pct = Math.round((report.progress || 0) * 100);
      progressInner.style.width = pct + '%';
      loadBtn.textContent = (report.text || 'Загрузка…').slice(0, 60);
    });

    await engine.reload(MODEL_ID);

    progressOuter.classList.remove('show');
    statusBadge.textContent = 'ГОТОВО';
    statusBadge.style.color = 'var(--amber)';
    addSystemNote('Модель загружена и закэширована. Дальнейшие запуски — без повторной загрузки, даже офлайн.');
    buildComposer();
  } catch (err) {
    console.error(err);
    statusBadge.textContent = 'ОШИБКА';
    statusBadge.style.color = 'var(--danger)';
    loadBtn.disabled = false;
    loadBtn.textContent = 'Не получилось — повторить';
    addSystemNote('Ошибка загрузки: ' + (err?.message || err));
  }
}

async function handleSend(){
  if (generating || !engine) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  addMsg('user', text);
  history.push({ role: 'user', content: text });

  const assistantDiv = addMsg('assistant', '');
  generating = true;
  document.getElementById('send').disabled = true;
  input.disabled = true;

  const t0 = performance.now();
  let tokenCount = 0;

  try {
    const stream = await engine.chat.completions.create({
      messages: history,
      stream: true,
      temperature: 0.7,
    });

    let full = '';
    for await (const chunk of stream) {
      const delta = chunk.choices[0]?.delta?.content || '';
      full += delta;
      tokenCount++;
      assistantDiv.textContent = full;
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    history.push({ role: 'assistant', content: full });

    const seconds = (performance.now() - t0) / 1000;
    if (seconds > 0) {
      speedCell.textContent = (tokenCount / seconds).toFixed(1) + ' ток/с';
    }
  } catch (err) {
    console.error(err);
    assistantDiv.textContent = 'Ошибка генерации: ' + (err?.message || err);
  } finally {
    generating = false;
    document.getElementById('send').disabled = false;
    input.disabled = false;
    input.focus();
  }
}

// init
if (checkSupport()) {
  showLoadButton();
} else {
  loadBtn.style.display = 'none';
}
</script>

</body>
</html>
